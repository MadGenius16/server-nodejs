# swagger/components/schemas/student.yaml

type: object
required:
  - _id
  - name
  - phoneNumber
  - age
  - gender
  - avgMark
  - onDuty
properties:
  _id:
    description: "Student's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Student's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Student's phone number"
    type: string
    example: '+380501234567'
  age:
    description: "Student's age"
    type: number
    example: 16
  gender:
    description: "Student's gender"
    type: string
    enum: ['male', 'female', 'other']
  avgMark:
    description: "Student's average mark. Should be between 2 and 15"
    type: number
    minimum: 1
    maximum: 15
    example: 9
  onDuty:
    description: 'Whether is student on duty'
    type: boolean
    example: false
  parentId:
    description: "Student's parent id"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to student's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
