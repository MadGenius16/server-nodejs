# swagger/paths/contacts/post.yaml

tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Dmytro Boyko'
          phoneNumber:
            description: "Contact's phone number"
            type: number
            example: 380000000002
          email:
            description: "Contact's email"
            type: string
            example: dmytro.boyko@example.com
          contactType:
            description: "Type of contact"
            type: string
            enum: ['personal', 'home']
            example: personal
          isFavourite:
            description: 'Whether contact is favourite'
            type: boolean
            example: false
          parentId:
            description: "Contact owner's parent id"
            type: string
            example: 65e4decdd286b30065d54af9
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created contact!
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
