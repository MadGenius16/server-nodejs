# swagger/paths/contacts/{id}/put.yaml

tags:
  - Contacts
summary: Upsert contact by id
operationId: upsertContact
description: 'Create or replace contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            example: 'Dmytro Boyko'
          phoneNumber:
            type: number
            example: 380000000002
          email:
            type: string
            example: dmytro.boyko@example.com
          contactType:
            type: string
            enum: ['personal', 'home']
            example: personal
          isFavourite:
            type: boolean
            example: false
          parentId:
            type: string
            example: 65e4decdd286b30065d54af9
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Successfully upserted a contact!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully upserted a contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '201':
    description: Successfully created a contact!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully upserted a contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
