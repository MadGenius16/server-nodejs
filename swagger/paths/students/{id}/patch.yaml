# swagger/paths/students/{id}/patch.yaml

tags:
  - Students
summary: Patch student by id
operationId: patchStudent
description: 'Partially update student by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'John Doe'
          age:
            type: number
            example: 12
          gender:
            type: string
            enum: ['male', 'female', 'other']
          avgMark:
            type: number
            example: 9.7
          onDuty:
            type: boolean
            example: true
          parentId:
            type: string
            example: 65e4decdd286b30065d54af9
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Successfully patched a student!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a student!
            data:
              type: object
              $ref: '../../../components/schemas/student.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
