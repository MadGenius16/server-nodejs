# swagger/paths/students/{id}/put.yaml

tags:
  - Students
summary: Upsert student by id
operationId: upsertStudent
description: 'Create or replace student by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - age
          - gender
          - avgMark
          - parentId
        properties:
          name:
            description: "Student's name"
            type: string
            example: 'John Doe'
          age:
            description: "Student's age"
            type: number
            example: 12
          gender:
            description: "Student's gender"
            type: string
            enum: ['male', 'female', 'other']
          avgMark:
            description: "Student's average mark. Should be between 1 and 12"
            type: number
            example: 9.7
          onDuty:
            description: 'Whether is student on duty'
            type: boolean
            example: false
          parentId:
            description: "Student's parent id"
            type: string
            example: 65e4decdd286b30065d54af9
          photo:
            description: "Student's photo"
            type: string
            format: binary
responses:
  '200':
    description: Successfully upserted a student!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully upserted a student!
            data:
              type: object
              $ref: '../../../components/schemas/student.yaml'
  '201':
    description: Successfully created a student!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully upserted a student!
            data:
              type: object
              $ref: '../../../components/schemas/student.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
